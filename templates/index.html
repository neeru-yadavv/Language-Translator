<!DOCTYPE html>
<html>

<head>
    <title>Advanced Translator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <h1>🌍 Smart Language Translator</h1>

    <form method="POST" id="form">

        <textarea id="inputText" name="text" placeholder="Enter text..." required></textarea>

        <br><br>

        <select name="src_lang" id="src_lang">
            <option value="auto">Auto Detect</option>
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
        </select>

        🔁
        <select name="dest_lang" id="dest_lang">
            <option value="hi">Hindi</option>
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
        </select>

        <br><br>

        <button type="submit">Translate</button>
        <button type="button" onclick="swapLang()">Swap</button>
        <button type="button" onclick="clearText()">Clear</button>

    </form>

    <h2>Translated Text:</h2>
    <p id="outputText">{{ translated_text }}</p>

    <br>

    <button onclick="copyText()">📋 Copy</button>
    <button onclick="speakText()">🔊 Speak</button>

    <script>
        function swapLang() {
            let src = document.getElementById("src_lang");
            let dest = document.getElementById("dest_lang");

            let temp = src.value;
            src.value = dest.value;
            dest.value = temp;
        }

        function clearText() {
            document.getElementById("inputText").value = "";
            document.getElementById("outputText").innerText = "";
        }

        function copyText() {
            let text = document.getElementById("outputText").innerText;
            navigator.clipboard.writeText(text);
            alert("Copied!");
        }

        function speakText() {
            let text = document.getElementById("outputText").innerText;
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = document.getElementById("dest_lang").value;
            window.speechSynthesis.speak(speech);
        }
    </script>

</body>

</html>
